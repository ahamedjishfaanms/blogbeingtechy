<style>
  :root{
    --bg:#14171C; --surface:#1B1F26; --surface-2:#20252D; --line:#2B313B;
    --text:#EDEAE2; --text-muted:#8B92A0; --accent:#E8A33D; --signal:#4FB0C6;
    --radius:4px; --max:1180px; --article-max:700px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6; }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 28px; }
  .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--signal); }
  .dot.pulse{ animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(79,176,198,.55);} 50%{box-shadow:0 0 0 5px rgba(79,176,198,0);} }

  header{ position:sticky; top:0; z-index:40; background:rgba(20,23,28,.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
  .logo{ font-family:var(--font-mono); font-weight:500; font-size:16px; display:flex; align-items:center; gap:8px; text-transform:lowercase; }
  .logo b{ color:var(--accent); font-weight:600; }
  .back{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; }
  .back:hover{ color:var(--accent); }

  article{ max-width:var(--article-max); margin:0 auto; padding:56px 0 40px; }
  .meta{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:8px; margin-bottom:20px; }
  .meta .tag{ color:var(--accent); }
  h1{ font-family:var(--font-display); font-weight:500; font-size:clamp(30px,4.6vw,46px); line-height:1.1; letter-spacing:-.01em; margin-bottom:22px; }
  .byline{ display:flex; justify-content:space-between; align-items:center; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted); margin-bottom:36px; }
  .cover{ width:100%; aspect-ratio:16/9; border-radius:var(--radius); overflow:hidden; background:var(--surface); border:1px solid var(--line); margin-bottom:36px; }

  /* ---- share row ---- */
  .share-row{ display:flex; align-items:center; gap:10px; margin:28px 0; flex-wrap:wrap; }
  .share-label{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin-right:2px; }
  .share-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:none;
    color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:all .15s; flex:none; position:relative;
  }
  .share-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .share-btn svg{ width:15px; height:15px; }
  .share-btn .copied-tip{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--bg); font-family:var(--font-mono); font-size:11px;
    padding:5px 9px; border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity .15s ease;
  }
  .share-btn .copied-tip.show{ opacity:1; }
  .share-row.bottom{ padding-top:28px; border-top:1px solid var(--line); margin-top:8px; }
  .cover img{ width:100%; height:100%; object-fit:cover; }

  .content{ font-size:17.5px; color:#D9D6CC; }
  .content p{ margin-bottom:22px; }
  .content h2{ font-family:var(--font-display); font-size:28px; font-weight:500; margin:40px 0 16px; color:var(--text); }
  .content h3{ font-family:var(--font-display); font-size:22px; font-weight:500; margin:32px 0 14px; color:var(--text); }
  .content a{ color:var(--signal); text-decoration:underline; text-underline-offset:3px; }
  .content code{ font-family:var(--font-mono); font-size:.9em; background:var(--surface-2); padding:2px 6px; border-radius:3px; }
  .content pre{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px; overflow-x:auto; margin:22px 0; }
  .content pre code{ background:none; padding:0; }
  .content blockquote{ border-left:3px solid var(--accent); padding-left:18px; color:var(--text-muted); margin:22px 0; font-style:italic; }
  .content ul, .content ol{ margin:0 0 22px 22px; }
  .content li{ margin-bottom:8px; }

  .ad-slot{ margin:36px 0; padding:14px; border:1px dashed var(--line); border-radius:var(--radius); text-align:center; }
  .ad-slot::before{ content:'ADVERTISEMENT'; display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:var(--text-muted); margin-bottom:8px; }

  .tags{ display:flex; gap:8px; margin-top:36px; flex-wrap:wrap; }
  .tags a{ font-family:var(--font-mono); font-size:11.5px; padding:6px 12px; border:1px solid var(--line); border-radius:100px; color:var(--text-muted); }
  .tags a:hover{ color:var(--accent); border-color:var(--accent); }

  .related{ max-width:var(--article-max); margin:0 auto; padding:0 0 60px; }
  .related h4{ font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); margin-bottom:18px; display:flex; align-items:center; gap:12px; }
  .related h4::after{ content:''; flex:1; height:1px; background:var(--line); }
  .related-item{ display:block; padding:16px 0; border-top:1px solid var(--line); }
  .related-item:last-child{ border-bottom:1px solid var(--line); }
  .related-item .rtitle{ font-family:var(--font-display); font-size:17px; margin-bottom:4px; }
  .related-item .rmeta{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }

  .state{ max-width:var(--article-max); margin:0 auto; padding:80px 28px; text-align:center; color:var(--text-muted); }
  .state h4{ font-family:var(--font-display); font-size:24px; color:var(--text); margin-bottom:10px; font-weight:500; }

  footer{ padding:32px 0; border-top:1px solid var(--line); text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }

  /* ============ LIGHT / DARK THEME ============ */
  [data-theme="light"]{
    --bg:#FFFFFF;
    --surface:#FAF8F3;
    --surface-2:#F3EFE5;
    --line:#ECE6D8;
    --text:#201C15;
    --text-muted:#756B58;
    --accent:#A6690F;       /* workhorse — button.primary bg, links, yellow-toned text */
    --accent-icon:#E8A33D;  /* unchanged brand gold — icons, thin borders, tiny badges only */
    --accent-tint:#FAEEDA;  /* pale tint — hover states, status backgrounds */
    --accent-dim:#D9B27C;
    --signal:#1D8DA6;
    --danger:#C24A34;
    --author-c:#5C8A46;
  }

  /* ---- theme toggle switch ---- */
  .theme-toggle{ background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; flex:none; }
  .tt-track{
    position:relative; width:52px; height:26px; border-radius:100px;
    background:var(--surface-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 5px; box-sizing:border-box; transition:background .25s ease, border-color .25s ease;
  }
  .tt-static{ width:12px; height:12px; position:relative; z-index:1; flex-shrink:0; }
  .tt-static-sun{ color:#E8A33D; opacity:.6; }
  .tt-static-moon{ color:var(--text-muted); opacity:.7; }
  .tt-knob{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#EDEAE2; display:flex; align-items:center; justify-content:center;
    transform:translateX(26px); transition:transform .25s ease, background .25s ease; z-index:2;
  }
  .tt-knob svg{ width:12px; height:12px; position:absolute; transition:opacity .2s ease; }
  .tt-knob-sun{ color:#E8A33D; opacity:0; }
  .tt-knob-moon{ color:#14171C; opacity:1; }
  [data-theme="light"] .tt-knob{ transform:translateX(0); background:#14171C; }
  [data-theme="light"] .tt-knob-sun{ opacity:1; }
  [data-theme="light"] .tt-knob-moon{ opacity:0; }
</style>

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4eW14eXJhbmFoc3BxZGRnZXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDg0NzYsImV4cCI6MjA5OTYyNDQ3Nn0.z4G7IolUNms8Nc2m8lY7ETeAxyInSmGDlp5uB8vG4nQ';

const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');
const main = document.getElementById('main');

function timeAgo(dateStr){
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 3600) return Math.max(1, Math.floor(diff/60)) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return new Date(dateStr).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function shareRowHtml(post, variant){
  const url = window.location.origin + window.location.pathname + '?slug=' + encodeURIComponent(post.slug);
  const text = post.title;
  const u = encodeURIComponent(url);
  const t = encodeURIComponent(text);
  return `
    <div class="share-row ${variant === 'bottom' ? 'bottom' : ''}">
      <span class="share-label">Share</span>
      <a class="share-btn" href="https://twitter.com/intent/tweet?url=${u}&text=${t}" target="_blank" rel="noopener" aria-label="Share on X">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.5 22H1.4l8.1-9.3L1 2h7.2l5 6.6L18.9 2zm-1.2 18h1.7L7.4 4H5.6l12.1 16z"/></svg>
      </a>
      <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${u}" target="_blank" rel="noopener" aria-label="Share on LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="4" height="11"/><circle cx="5" cy="4.5" r="1.5"/><path d="M11 20v-7a3 3 0 0 1 6 0v7M11 9v11"/></svg>
      </a>
      <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener" aria-label="Share on Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.7c0-.9.3-1.6 1.6-1.6h1.7V3.2c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H7.4V13H10v8h3.5z"/></svg>
      </a>
      <a class="share-btn" href="https://wa.me/?text=${t}%20${u}" target="_blank" rel="noopener" aria-label="Share on WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8 1-.2.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.2-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 4 3.4.6.2 1 .4 1.3.5.6.2 1.1.1 1.5.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.4-.3z"/></svg>
      </a>
      <button class="share-btn" type="button" onclick="copyShareLink(this, '${url.replace(/'/g, "\\'")}')" aria-label="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5"/></svg>
        <span class="copied-tip">Copied!</span>
      </button>
    </div>`;
}

window.copyShareLink = function(btn, url){
  navigator.clipboard.writeText(url).then(() => {
    const tip = btn.querySelector('.copied-tip');
    tip.classList.add('show');
    setTimeout(() => tip.classList.remove('show'), 1600);
  }).catch(() => {});
};

function renderPost(post, related){
  document.getElementById('pageTitle').textContent = post.title + ' — BeingTechy';
  document.getElementById('pageDesc').setAttribute('content', post.excerpt || '');

  main.innerHTML = `
    <article>
      <div class="meta"><span class="tag">${post.category || 'general'}</span><span>·</span><span>${timeAgo(post.created_at)}</span></div>
      <h1>${post.title}</h1>
      <div class="byline">
        <span>By ${post.author || 'BeingTechy Staff'}</span>
        <span>${post.read_time ? post.read_time + ' min read' : ''}</span>
      </div>
      ${shareRowHtml(post)}
      ${post.cover_image ? `<div class="cover"><img src="${post.cover_image}" alt=""></div>` : ''}

      <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6780480728242580" data-ad-slot="0000000002" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>

      <div class="content">${post.content || '<p>' + (post.excerpt || '') + '</p>'}</div>

      ${shareRowHtml(post, 'bottom')}

      <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6780480728242580" data-ad-slot="0000000003" data-ad-format="auto" data-full-width-responsive="true"></ins>
      </div>

      ${post.tags && post.tags.length ? `<div class="tags">${post.tags.map(t => `<a href="index.html#grid">#${t}</a>`).join('')}</div>` : ''}
    </article>

    <div class="related">
      <h4>More from BeingTechy</h4>
      ${related.map(r => `
        <a class="related-item" href="post.html?slug=${encodeURIComponent(r.slug)}">
          <div class="rtitle">${r.title}</div>
          <div class="rmeta">${(r.category || 'general')} · ${timeAgo(r.created_at)}</div>
        </a>
      `).join('') || '<p style="color:var(--text-muted); font-size:14px;">No other posts yet.</p>'}
    </div>
  `;

  try{
    document.querySelectorAll('.adsbygoogle').forEach(() => (window.adsbygoogle = window.adsbygoogle || []).push({}));
  }catch(e){ console.warn('AdSense not yet available:', e); }
}

function renderMissing(message){
  main.innerHTML = `<div class="state"><h4>Post not found</h4><p>${message}</p><p style="margin-top:18px;"><a href="index.html" style="color:var(--accent);">← Back to all posts</a></p></div>`;
}

async function loadPost(){
  if (!slug){ renderMissing('No post slug was given in the URL.'); return; }

  if (!supabaseClient){
    // Demo mode — shown until Supabase is connected.
    renderPost({
      title:'Connect Supabase to load real articles',
      slug:'demo-1',
      excerpt:'This is placeholder content.',
      category:'dev',
      author:'BeingTechy Staff',
      created_at:new Date().toISOString(),
      read_time:3,
      content:'<p>Set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of the script in both <code>index.html</code> and <code>post.html</code>. Once connected, this page fetches the row from the <code>posts</code> table whose <code>slug</code> matches the URL, e.g. <code>post.html?slug=my-article</code>.</p><p>The <code>content</code> column can hold HTML directly (as rendered here) or Markdown you convert to HTML client-side.</p>',
      tags:['supabase','setup']
    }, []);
    return;
  }

  const { data: post, error } = await supabaseClient
    .from('posts')
    .select('*')
    .eq('slug', slug)
    .eq('published', true)
    .single();

  if (error || !post){
    renderMissing(error ? error.message : 'This post doesn\'t exist or isn\'t published yet.');
    return;
  }

  const { data: related } = await supabaseClient
    .from('posts')
    .select('title, slug, category, created_at')
    .eq('published', true)
    .neq('slug', slug)
    .order('created_at', { ascending:false })
    .limit(3);

  renderPost(post, related || []);
  logPageView(slug);
}

/* Best-effort visitor country lookup, via a free no-key IP geolocation API.
   Cached per browser tab so we don't call it on every page view. Fails
   silently — a page view is still logged even if this comes back empty. */
async function getVisitorCountry(){
  try{
    const cached = sessionStorage.getItem('bt-country');
    if (cached) return cached;
    const res = await fetch('https://ipwho.is/');
    const geo = await res.json();
    const country = (geo && geo.success !== false && geo.country) ? geo.country : null;
    if (country) sessionStorage.setItem('bt-country', country);
    return country;
  }catch(e){ return null; }
}

/* Logs one row to the page_views table for the Analytics tab in admin.html.
   Write-only from the visitor's side (see supabase-setup.sql) — fails silently
   if Supabase isn't connected yet or the insert doesn't go through. */
async function logPageView(postSlug){
  if (!supabaseClient) return;
  try{
    const country = await getVisitorCountry();
    await supabaseClient.from('page_views').insert({ path: 'post', slug: postSlug, country });
  }
  catch(e){ /* analytics should never break the page */ }
}

loadPost();
</script>


<script>
(function(){
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  var root = document.documentElement;
  function isLight(){ return root.getAttribute('data-theme') === 'light'; }
  btn.setAttribute('aria-pressed', isLight() ? 'true' : 'false');
  btn.addEventListener('click', function(){
    if (isLight()){
      root.removeAttribute('data-theme');
      try{ localStorage.setItem('bt-theme','dark'); }catch(e){}
      btn.setAttribute('aria-pressed','false');
    } else {
      root.setAttribute('data-theme','light');
      try{ localStorage.setItem('bt-theme','light'); }catch(e){}
      btn.setAttribute('aria-pressed','true');
    }
  });
})();
</script>
</body>
</html>
